[build]
command = "pnpm run build:netlify"
publish = "artifacts/momentaa/dist/public"
functions = "artifacts/api-server/dist/functions"

[build.environment]
NODE_VERSION = "22"
PNPM_VERSION = "10.33.4"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200

[[redirects]]
from = "/admin"
to = "/admin.html"
status = 200

[[redirects]]
from = "/customer"
to = "/customer.html"
status = 200

[[redirects]]
from = "/uploads/*"
to = "/public/uploads/:splat"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
